# ==============================================================================
# BlueSCSI v2 Configuration File (bluescsi.ini) - Optimized for Atari TT030
# Place this file in the root of the MicroSD card used by BlueSCSI v2
# ==============================================================================

[BlueSCSI]
# System Target Identification
System = AtariTT

# SCSI Bus Performance Settings for Atari TT030 Internal Bus
# TT030 supports 8-bit narrow SCSI burst transfers
DirectGPO = 0
EnableSelectionDelay = 0
Parity = 1

# Target SCSI ID Definitions:
# Target 0: Primary Hard Disk (TOS 3.06 / ICD AdSCSI boot volume)
# Image Filename: HD00_512.img (e.g. 1GB - 4GB image file)
[Target0]
Type = HardDisk
BlockSize = 512

# Target 3: DaynaPORT SCSI Ethernet Emulation (STiNG / FreeMiNT network)
[Target3]
Type = DaynaPORT

# Target 6: CD-ROM Emulation (ISO images for software installation)
[Target6]
Type = CD-ROM
BlockSize = 2048

# Global Debug Logging Level (0 = Off, 1 = Error, 2 = Info, 3 = Debug)
Debug = 1
