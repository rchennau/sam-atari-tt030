# /etc/dropbear/dropbear.conf — sourced by /etc/rc.dropbear at boot (%config(noreplace): package updates keep your edits).
# DROPBEAR_NO_ATW=1 keeps X25519/Ed25519 on the 68030 instead of the T425. Needed in ATW800/2 modes with a pixel
# clock >= 108 MHz (e.g. mode 32, 1920x1080x8): T425 work there blanks the HDMI picture (measured 2026-10-15).
# Comment it out in modes <= 102.6 MHz (15, 22, 24, 28; FR-6 2026-10-17) for ~16-18 s logins instead of ~27 s.
DROPBEAR_NO_ATW=1
